name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/install.test.mjs

  regression:
    name: ${{ matrix.test }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        test:
          - test-reviewer-config.sh
          - test-review-preflight.sh
          - test-global-skill-contract.sh
          - test-report-contract.sh
          - test-pr-review-context.sh
          - test-review-finding-parser.mjs
          - test-adjudication-invariants.mjs
          - test-final-findings.sh
          - test-large-review-blobs.mjs
          - test-review-run-artifacts.sh
          - test-review-pair.sh
          - test-wave-lock-races.mjs
          - test-review-wave.sh
          - test-claude-review-runner.sh
          - test-claude-review-attestation.sh
          - test-codex-runners.sh
          - test-reviewer-launcher.sh
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y jq ripgrep
      - name: Configure fixture commit identity
        run: |
          git config --global user.name 'Test fixture'
          git config --global user.email 'fixture@example.invalid'
          git config --global init.defaultBranch main
      - name: Run test
        env:
          TEST_FILE: ${{ matrix.test }}
        run: |
          case "$TEST_FILE" in
            *.mjs) node "skills/cc-deep-review/tests/$TEST_FILE" ;;
            *.sh) bash "skills/cc-deep-review/tests/$TEST_FILE" ;;
            *) exit 2 ;;
          esac
